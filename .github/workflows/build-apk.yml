name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main, 'v1.1.0-root-shell', '*-root-shell']

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DSH_MAVEN_MIRRORS: 0
      UBUNTU_MIRROR: https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release
      UBUNTU_ARCHIVE_AMD64: http://archive.ubuntu.com/ubuntu
      UBUNTU_ARCHIVE_ARM64: http://ports.ubuntu.com/ubuntu-ports
      NODE_MIRROR: https://nodejs.org/dist
      NPM_REGISTRY: https://registry.npmjs.org
      PBS_MIRROR: https://github.com/astral-sh/python-build-standalone/releases/download
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable

      - name: Accept Android licenses and install NDK for tawcroot
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Prepare runtime (arm64-v8a)
        run: |
          python3 - <<'PY'
          import urllib.request, zipfile, pathlib, shutil
          url = "https://github.com/ccch1mneyyy/dsh-go/releases/download/v1.1.0/dsh-go-1.1.0-arm64.apk"
          apk_path = pathlib.Path("/tmp/dsh-go-1.1.0-arm64.apk")
          with urllib.request.urlopen(url, timeout=120) as r, apk_path.open("wb") as out:
              shutil.copyfileobj(r, out)
          out_root = pathlib.Path("runtime/out/arm64-v8a")
          with zipfile.ZipFile(apk_path) as zf:
              for name in zf.namelist():
                  if name.startswith("assets/runtime/") and not name.endswith("/"):
                      dest = out_root / name
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(name) as src, dest.open("wb") as dst:
                          shutil.copyfileobj(src, dst)
                  elif name in (
                      "lib/arm64-v8a/libproot.so",
                      "lib/arm64-v8a/libproot-loader.so",
                      "lib/arm64-v8a/libtalloc.so",
                      "lib/arm64-v8a/libandroid-shmem.so",
                  ):
                      dest = out_root / "jniLibs/arm64-v8a" / pathlib.Path(name).name
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(name) as src, dest.open("wb") as dst:
                          shutil.copyfileobj(src, dst)
          apk_path.unlink(missing_ok=True)
          PY
          python3 -I tooling/check_runtime_bundle.py arm64

      - name: Build APK
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" DSH_BETA_TOKEN_FILE= bash tooling/build-apk.sh -f arm64

      - name: Show artifacts
        run: find app/build/app/outputs -name '*.apk' -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-apk-arm64
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 2
